<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="书评集：记录每一次阅读。浏览书籍、经典评论与阅读笔记。"
    />
    <meta name="robots" content="index,follow" />
    <meta property="og:site_name" content="书评集" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="书评集 · 用书评记录每一次阅读" />
    <meta
      property="og:description"
      content="书评集：记录每一次阅读。浏览书籍、经典评论与阅读笔记。"
    />
    <meta property="og:url" content="https://home.bayh.pp.ua/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://bayh.pp.ua" crossorigin />
    <title>书评集 · 用书评记录每一次阅读</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme-preference');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (error) {
          // The app still works without a saved theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast-root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const setViewportHeight = () => {
        // 获取实际的视口高度
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      };

      // 立即运行一次，并监听 resize 事件
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
    </script>
  </body>
</html>
